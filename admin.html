<style>
  :root { --teal: #00ADB5; --teal-dark: #007A80; --ink: #111111; --mut: #5C6360; --line: #E2E4E3; --bg: #F5F6F5; }
  * { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--ink); background: var(--bg); font-size: 15px; line-height: 1.5; }
  button, input, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  .serif { font-family: Georgia, serif; font-style: italic; font-weight: 400; }

  /* top bar */
  .top { position: sticky; top: 0; z-index: 10; background: #000000; color: #FFFFFF; display: flex; align-items: center; gap: 14px; padding: 10px 20px; min-height: 60px; }
  .top img { width: 38px; height: 38px; }
  .top .ttl { font-weight: 800; letter-spacing: -0.02em; font-size: 17px; }
  .top .ttl small { display: block; font-weight: 400; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #9FA7A4; }
  .top .sp { flex: 1; }
  .top .viewsite { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; text-decoration: none; padding: 10px 12px; border: 1px solid #444444; }
  .status { font-size: 12px; color: #CFD6D3; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #5C6360; display: inline-block; }
  .dot.on { background: #F2B705; }
  .dot.ok { background: var(--teal); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 1px solid var(--ink); background: #FFFFFF; color: var(--ink); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--teal); border-color: var(--teal); color: #000000; }
  .btn.dark { background: var(--ink); color: #FFFFFF; }
  .btn.ghost { border-color: transparent; background: transparent; text-decoration: underline; text-underline-offset: 3px; padding: 0 8px; }
  .btn[disabled] { opacity: 0.4; cursor: default; }
  .top .btn.ghost { color: #CFD6D3; }

  /* layout */
  .wrap { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: calc(100vh - 60px); }
  nav.side { background: #FFFFFF; border-right: 1px solid var(--line); padding: 18px 12px; }
  nav.side button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px; border: 0; background: none; cursor: pointer; font-size: 14px; border-left: 3px solid transparent; }
  nav.side button[aria-current="page"] { background: #EAF7F7; border-left-color: var(--teal); font-weight: 700; }
  nav.side .grp { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mut); margin: 18px 12px 6px; }
  nav.side .soon { color: #9AA19E; cursor: default; }
  nav.side .soon em { font-style: normal; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-left: auto; }
  main { padding: 32px 4vw 80px; max-width: 1180px; }
  h1 { font-size: 40px; letter-spacing: -0.045em; line-height: 1.05; margin: 0 0 8px; font-weight: 800; }
  h2 { font-size: 20px; letter-spacing: -0.02em; margin: 0 0 6px; }
  .lede { color: var(--mut); margin: 0 0 26px; max-width: none; }
  .panel { background: #FFFFFF; border: 1px solid var(--line); padding: 22px; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.9fr); gap: 22px; align-items: start; }
  .lbl { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--mut); margin: 0 0 8px; }
  .previewbox { position: sticky; top: 84px; }

  /* home tiles */
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .tile { text-align: left; background: #FFFFFF; border: 1px solid var(--line); padding: 22px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-height: 170px; }
  .tile:hover { border-color: var(--ink); }
  .tile b { font-size: 19px; letter-spacing: -0.02em; }
  .tile span { color: var(--mut); font-size: 14px; }
  .tile .now { margin-top: auto; font-size: 12px; color: var(--ink); background: var(--bg); padding: 8px 10px; }
  .tile.soon { cursor: default; opacity: 0.55; }
  .auto { margin-top: 26px; display: flex; gap: 16px; align-items: flex-start; background: #FFFFFF; border: 1px solid var(--line); border-left: 4px solid var(--teal); padding: 18px 20px; }
  .auto ul { margin: 6px 0 0; padding-left: 18px; color: var(--mut); }

  /* form fields */
  .field { display: block; margin: 0 0 18px; }
  .field .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .field .count { font-weight: 400; font-size: 12px; color: var(--mut); }
  .field .count.near { color: #B26A00; }
  .field input[type=text], .field input[type=url], .field textarea { display: block; width: 100%; padding: 12px; border: 1px solid #C9CDCB; background: #FFFFFF; font-size: 15px; }
  .field textarea { min-height: 120px; resize: vertical; }
  .field input:focus, .field textarea:focus { outline: 2px solid var(--teal); outline-offset: 0; border-color: var(--teal); }
  .hint { font-size: 12px; color: var(--mut); margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-height: 40px; padding: 0 14px; border: 1px solid #C9CDCB; background: #FFFFFF; cursor: pointer; font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }

  /* switch */
  .switch { display: flex; align-items: center; gap: 16px; padding: 18px; border: 1px solid var(--line); background: #FFFFFF; cursor: pointer; width: 100%; text-align: left; }
  .switch .knob { flex: none; width: 58px; height: 32px; border-radius: 16px; background: #C9CDCB; position: relative; transition: background 0.15s; }
  .switch .knob::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; transition: left 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,0.25); }
  .switch[aria-checked="true"] .knob { background: var(--teal); }
  .switch[aria-checked="true"] .knob::after { left: 29px; }
  .switch b { display: block; font-size: 17px; }
  .switch span { color: var(--mut); font-size: 13px; }

  /* list rows */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; align-items: center; gap: 14px; background: #FFFFFF; border: 1px solid var(--line); padding: 12px 14px; }
  .item.open { border-color: var(--ink); }
  .item .main { flex: 1; min-width: 0; cursor: pointer; background: none; border: 0; text-align: left; padding: 4px 0; }
  .item .main b { display: block; }

  const STAFF0 = [{"name": "Brittany Brady", "role": "Founder & owner", "tag": "Owner", "bio": "Brittany Brady (Cederberg) is the founder and CEO of Dance & All That Jazz Studio, which she established in 2013.\nBrittany’s passion for dance began at the young age of four, quickly growing into a lifelong love. She continued to dance throughout high school and later attended Illinois State University, where she was a member of the Redline Dance Team. Brittany pursued her passion by majoring in Business Entrepreneurship & Management with a minor in Dance Performance. Even as a little girl, Brittany had a clear vision for her future. Before heading off to college, she noticed a newly constructed strip mall in her hometown of Prospect Heights. She confidently told her parents that she would one day open her dance studio there.\nAfter graduating from college, Brittany continued to teach dance while working at a bank. Despite her success in banking, the dream of opening a dance studio never faded. In 2013, Brittany took the leap and fulfilled her dream, launching Dance & All That Jazz Studio with just eight classes a week. By 2016, Brittany’s vision had expanded, leading her to take over an additional space next to her studio. The studio expanded again in 2022, with the opening of a third studio space, now offering more than 70 classes a week.\nBrittany is grateful for the supportive community that has grown around Dance & All That Jazz. She is committed to maintaining a welcoming environment where dance, performance, and competition can thrive together. At Dance & All That Jazz, dancers not only learn to dance but also pick up valuable life skills and build meaningful friendships.", "photo": "https://static.wixstatic.com/media/4c2aeb_6292969826d64288a90ad7b204fd53d2~mv2.jpg/v1/fill/w_480,h_600,al_c,q_85,enc_auto/photo.jpg"},

    }

    if (page === 'company2') { const g = $('coGo'); if (g) { g.addEventListener('click', () => coUnlock($('coPw').value)); $('coPw').addEventListener('keydown', (e) => { if (e.key === 'Enter') coUnlock($('coPw').value); }); }
      if (co) { bind('coSheet', 400, v => draft.coEdit.sheet = v); bind('coNewPw', 60, v => draft.coEdit.pwNote = v); } }
    bindList(); bindTexts();
    if (page === 'prices') { const P = draft.prices;
      const on = (sel, fn) => document.querySelectorAll(sel).forEach(el => el.addEventListener('change', () => { fn(el); saveDraft(); render(); }));
      on('[data-sl]', el => P.sessions[+el.dataset.sl].liveFrom = el.value);
      on('[data-sn]', el => P.sessions[+el.dataset.sn].name = el.value.trim() || 'Session');
      on('[data-sd]', el => P.sessions[+el.dataset.sd].dates = el.value.trim());
      on('[data-sw]', el => { const n = num(el.value); P.sessions[+el.dataset.sw].weeks = n == null ? '' : Math.round(n); });
      on('[data-rate]', el => { const n = num(el.value); if (n != null) P.rates[el.dataset.rate] = n; });
      on('[data-sp]', el => { const n = num(el.value); if (n != null) P.specials[+el.dataset.sp].rate = n; });

    if (page === 'nav') document.querySelectorAll('[data-hdr]').forEach(el => el.addEventListener('change', () => { draft.nav[+el.dataset.hdr].header = el.checked; saveDraft(); render(); }));
    if (page === 'photos') document.querySelectorAll('[data-slot]').forEach(el => el.addEventListener('change', () => { const file = el.files && el.files[0]; if (!file) return; const k = el.dataset.slot;
      shrink(file, (u) => { if (/^prog/.test(k)) draft.home.programs[+k.slice(4)].photo = u; else draft.photos[k] = u; saveDraft(); render(); }, 1200, 900); }));
    if (page === 'staff' && openItem >= 0) { const s = draft.staff[openItem]; const up = () => pv().innerHTML = staffPreview(s);
      bind('sN', 30, v => s.name = v, up); { const st = $('sT'); if (st) st.addEventListener('input', () => { s.tag = st.value; saveDraft(); up(); }); } bind('sR', 40, v => s.role = v, up); bind('sB', 2000, v => s.bio = v, () => { up(); const tg = document.querySelector('.item.open .tag'); if (tg) tg.style.display = s.bio.trim() ? 'none' : ''; });
      const f = $('sPhoto'); if (f) f.addEventListener('change', () => { const file = f.files && f.files[0]; if (!file) return; shrink(file, (url) => { s.photo = url; saveDraft(); render(); }); }); }
  }
  // resize photos in the browser so they stay small
  function shrink(file, done, tw, th) {
    const img = new Image(); const r = new FileReader();
    r.onload = () => { img.onload = () => { const W = tw || 480, H = th || 600, c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
      const s = Math.max(W / img.width, H / img.height), w = img.width * s, h = img.height * s; g.drawImage(img, (W - w) / 2, (H - h) / 2, w, h); done(c.toDataURL('image/jpeg', 0.82)); };
      img.onerror = () => toast('That file doesn’t look like a photo.'); img.src = r.result; };
    r.readAsDataURL(file);
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, [data-go]'); if (!t) return;
    const d = t.dataset;
    if (d.menu) { menuOpen = !menuOpen; navs(); return; }
    if (d.menux) { menuOpen = false; navs(); return; }
    if (d.go) return go(d.go);
    if (d.rteam !== undefined) { rosterTeam = +d.rteam; openCard = ''; delCard = ''; render(); return; }
    if (t.id === 'sumSw') { draft.texts.summerShow = draft.texts.summerShow === 'off' ? 'on' : 'off'; saveDraft(); render(); return; }
    if (listClick(d)) return;
    if (t.id === 'publishTop' || t.id === 'publishBar') return publish();
    if (t.id === 'discardTop' || t.id === 'discardBar') return discard();
    if (d.nup !== undefined || d.ndown !== undefined) { const i = +(d.nup !== undefined ? d.nup : d.ndown), j = d.nup !== undefined ? i - 1 : i + 1; const a = draft.nav; [a[i], a[j]] = [a[j], a[i]]; saveDraft(); render(); return; }
    if (d.reset !== undefined) { delete draft.prices.byKey[d.reset]; saveDraft(); render(); return; }
    if (d.sx !== undefined) { const P = draft.prices, i = +d.sx; P.sessions.splice(i, 1); if (P.current >= P.sessions.length) P.current = P.sessions.length - 1; else if (P.current > i) P.current--; saveDraft(); render(); return; }
    if (t.id === 'sAddS') { const P = draft.prices; P.sessions.push({ name: 'Session ' + (P.sessions.length + 1), dates: '', weeks: '' }); saveDraft(); render(); return; }
    if (d.slotx !== undefined) { const k = d.slotx; if (/^prog/.test(k)) draft.home.programs[+k.slice(4)].photo = ''; else delete draft.photos[k]; saveDraft(); render(); return; }
    if (t.id === 'pPhotoX') { draft.home.programs[openItem].photo = ''; saveDraft(); render(); return; }
    if (t.id === 'recSw') { draft.recital = !draft.recital; saveDraft(); render(); return; }
    if (d.open !== undefined) { const i = +d.open; openItem = openItem === i ? -1 : i; confirmDel = -1; roleOther = false; render(); return; }
    if (d.close) { openItem = -1; confirmDel = -1; render(); return; }
    if (d.up !== undefined || d.down !== undefined) { const i = +(d.up !== undefined ? d.up : d.down), j = d.up !== undefined ? i - 1 : i + 1; const a = draft.staff; [a[i], a[j]] = [a[j], a[i]]; if (openItem === i) openItem = j; else if (openItem === j) openItem = i; saveDraft(); render(); return; }
    if (t.id === 'sPhotoX') { draft.staff[openItem].photo = ''; saveDraft(); render(); return; }
    if (d.del !== undefined) { confirmDel = +d.del; render(); return; }
    if (d.delno) { confirmDel = -1; render(); return; }
    if (d.delyes !== undefined) { const nm = draft.staff[+d.delyes].name; draft.staff.splice(+d.delyes, 1); openItem = -1; confirmDel = -1; saveDraft(); render(); toast(nm + ' removed. Press Publish to update the site.'); return; }
    if (d.role) { const p = draft.staff[openItem]; if (d.role === '__other') { roleOther = true; if (['Owner', 'Instructor', 'Studio manager', 'Front desk'].includes(p.tag)) p.tag = ''; } else { roleOther = false; p.tag = d.role; } saveDraft(); render(); if (roleOther) { const st = $('sT'); if (st) st.focus(); } return; }
    if (t.id === 'sAdd') { draft.staff.push({ name: '', role: '', tag: 'Instructor', bio: '', photo: '' }); roleOther = false; openItem = draft.staff.length - 1; saveDraft(); render(); const n = $('sN'); if (n) n.focus(); return; }
  });

  $('sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') { menuOpen = false; navs(); } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && menuOpen) { menuOpen = false; navs(); } });
  render();
})();
</script>
</body>
</html>
