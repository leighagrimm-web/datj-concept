<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio admin — Dance &amp; All That Jazz</title>
<style>
  :root { --teal: #00ADB5; --teal-dark: #007A80; --ink: #111111; --mut: #5C6360; --line: #E2E4E3; --bg: #F5F6F5; }
  * { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--ink); background: var(--bg); font-size: 15px; line-height: 1.5; }
  button, input, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  .serif { font-family: Georgia, serif; font-style: italic; font-weight: 400; }

  /* top bar */
  .top { position: sticky; top: 0; z-index: 10; background: #000000; color: #FFFFFF; display: flex; align-items: center; gap: 14px; padding: 10px 20px; min-height: 60px; }
  .top img { width: 38px; height: 38px; }
  .top .ttl { font-weight: 800; letter-spacing: -0.02em; font-size: 17px; }
  .top .ttl small { display: block; font-weight: 400; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #9FA7A4; }
  .top .sp { flex: 1; }
  .top .viewsite { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; text-decoration: none; padding: 10px 12px; border: 1px solid #444444; }
  .status { font-size: 12px; color: #CFD6D3; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #5C6360; display: inline-block; }
  .dot.on { background: #F2B705; }
  .dot.ok { background: var(--teal); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 1px solid var(--ink); background: #FFFFFF; color: var(--ink); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--teal); border-color: var(--teal); color: #000000; }
  .btn.dark { background: var(--ink); color: #FFFFFF; }
  .btn.ghost { border-color: transparent; background: transparent; text-decoration: underline; text-underline-offset: 3px; padding: 0 8px; }
  .btn[disabled] { opacity: 0.4; cursor: default; }
  .top .btn.ghost { color: #CFD6D3; }

  /* layout */
  .wrap { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: calc(100vh - 60px); }
  nav.side { background: #FFFFFF; border-right: 1px solid var(--line); padding: 18px 12px; }
  nav.side button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px; border: 0; background: none; cursor: pointer; font-size: 14px; border-left: 3px solid transparent; }
  nav.side button[aria-current="page"] { background: #EAF7F7; border-left-color: var(--teal); font-weight: 700; }
  nav.side .grp { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mut); margin: 18px 12px 6px; }
  nav.side .soon { color: #9AA19E; cursor: default; }
  nav.side .soon em { font-style: normal; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-left: auto; }
  main { padding: 32px 4vw 80px; max-width: 1180px; }
  h1 { font-size: 40px; letter-spacing: -0.045em; line-height: 1.05; margin: 0 0 8px; font-weight: 800; }
  h2 { font-size: 20px; letter-spacing: -0.02em; margin: 0 0 6px; }
  .lede { color: var(--mut); margin: 0 0 26px; max-width: 620px; }
  .panel { background: #FFFFFF; border: 1px solid var(--line); padding: 22px; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.9fr); gap: 22px; align-items: start; }
  .lbl { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--mut); margin: 0 0 8px; }
  .previewbox { position: sticky; top: 84px; }

  /* home tiles */
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .tile { text-align: left; background: #FFFFFF; border: 1px solid var(--line); padding: 22px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-height: 170px; }
  .tile:hover { border-color: var(--ink); }
  .tile b { font-size: 19px; letter-spacing: -0.02em; }
  .tile span { color: var(--mut); font-size: 14px; }
  .tile .now { margin-top: auto; font-size: 12px; color: var(--ink); background: var(--bg); padding: 8px 10px; }
  .tile.soon { cursor: default; opacity: 0.55; }
  .auto { margin-top: 26px; display: flex; gap: 16px; align-items: flex-start; background: #FFFFFF; border: 1px solid var(--line); border-left: 4px solid var(--teal); padding: 18px 20px; }
  .auto ul { margin: 6px 0 0; padding-left: 18px; color: var(--mut); }

  /* form fields */
  .field { display: block; margin: 0 0 18px; }
  .field .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .field .count { font-weight: 400; font-size: 12px; color: var(--mut); }
  .field .count.near { color: #B26A00; }
  .field input[type=text], .field input[type=url], .field textarea { display: block; width: 100%; padding: 12px; border: 1px solid #C9CDCB; background: #FFFFFF; font-size: 15px; }
  .field textarea { min-height: 120px; resize: vertical; }
  .field input:focus, .field textarea:focus { outline: 2px solid var(--teal); outline-offset: 0; border-color: var(--teal); }
  .hint { font-size: 12px; color: var(--mut); margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-height: 40px; padding: 0 14px; border: 1px solid #C9CDCB; background: #FFFFFF; cursor: pointer; font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }

  /* switch */
  .switch { display: flex; align-items: center; gap: 16px; padding: 18px; border: 1px solid var(--line); background: #FFFFFF; cursor: pointer; width: 100%; text-align: left; }
  .switch .knob { flex: none; width: 58px; height: 32px; border-radius: 16px; background: #C9CDCB; position: relative; transition: background 0.15s; }
  .switch .knob::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; transition: left 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,0.25); }
  .switch[aria-checked="true"] .knob { background: var(--teal); }
  .switch[aria-checked="true"] .knob::after { left: 29px; }
  .switch b { display: block; font-size: 17px; }
  .switch span { color: var(--mut); font-size: 13px; }

  /* list rows */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; align-items: center; gap: 14px; background: #FFFFFF; border: 1px solid var(--line); padding: 12px 14px; }
  .item.open { border-color: var(--ink); }
  .item .main { flex: 1; min-width: 0; cursor: pointer; background: none; border: 0; text-align: left; padding: 4px 0; }
  .item .main b { display: block; }
  .item .main span { color: var(--mut); font-size: 13px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thumb { width: 48px; height: 60px; background: #1C1C1C; flex: none; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #777777; font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .mini { width: 36px; height: 36px; border: 1px solid #C9CDCB; background: #FFFFFF; cursor: pointer; font-size: 15px; }
  .mini[disabled] { opacity: 0.3; cursor: default; }
  .tag { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; padding: 3px 7px; background: #FFF3CC; color: #7A5A00; white-space: nowrap; }
  .editor { background: #FFFFFF; border: 1px solid var(--ink); border-top: 0; padding: 20px; margin: -8px 0 0; }
  .confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: #FFF3F3; border: 1px solid #F0C9C9; padding: 12px 14px; margin-top: 14px; }

  /* previews (look like the site) */
  .pv-note { font-size: 12px; color: var(--mut); margin-top: 10px; }
  .pv-banner span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pv-banner { height: 34px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: var(--teal); color: #000000; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; gap: 12px; }
  .pv-banner b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pv-head { background: #000000; color: #FFFFFF; height: 56px; display: flex; align-items: center; padding: 0 16px; gap: 10px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; }
  .pv-head .logo { width: 30px; height: 30px; border-radius: 50%; background: var(--teal); }
  .pv-card { background: #F2F2F2; display: flex; flex-direction: column; max-width: 300px; }
  .pv-card .ph { height: 190px; background: #1C1C1C; display: flex; align-items: center; justify-content: center; color: #888888; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; overflow: hidden; }
  .pv-card .ph img { width: 100%; height: 100%; object-fit: cover; }
  .pv-card .bd { padding: 20px; }
  .pv-card h3 { font-size: 21px; letter-spacing: -0.035em; margin: 0 0 6px; }
  .pv-card p { font-size: 13px; color: #555555; margin: 0; }
  .pv-card .acts { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
  .pv-card .lnk { display: inline-block; padding: 10px 12px; background: #111111; color: #FFFFFF; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; }
  .pv-card .more { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; border-bottom: 1px solid #111111; padding-bottom: 2px; }
  .pv-slide { background: #FFFFFF; border: 1px solid var(--line); padding: 22px; margin-top: 14px; }
  .pv-slide .tg { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--teal-dark); font-weight: 700; margin-bottom: 6px; }
  .pv-slide h3 { font-size: 30px; letter-spacing: -0.05em; margin: 0 0 10px; line-height: 1; }
  .pv-slide p { font-size: 14px; color: #333333; margin: 0 0 10px; }
  .pv-slide ul { margin: 0; padding-left: 18px; font-size: 14px; color: #333333; }
  .pv-slide .photo { width: 150px; aspect-ratio: 4 / 5; background: #1C1C1C; margin-bottom: 14px; overflow: hidden; }
  .pv-slide .photo img { width: 100%; height: 100%; object-fit: cover; }
  .styles { display: flex; flex-wrap: wrap; gap: 6px; }
  .styles span { font-size: 12px; padding: 4px 9px; background: #EAF7F7; color: #00575B; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111111; color: #FFFFFF; padding: 12px 18px; font-size: 14px; z-index: 30; display: none; }
  .toast.show { display: block; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* phone */
  .tabs { display: none; }
  @media (max-width: 860px) {
    .wrap { grid-template-columns: minmax(0, 1fr); }
    .top .btn { min-height: 38px; padding: 0 12px; font-size: 11px; }
    .top .ttl { font-size: 15px; }
    .status { display: none; }
    .item { flex-wrap: wrap; }
    .item .main { flex-basis: 60%; }
    .editor { padding: 16px; }
    .item .mini[data-open] { display: none; }
    nav.side { display: none; }
    main { padding: 22px 18px 60px; }
    h1 { font-size: 32px; }
    .tiles { grid-template-columns: 1fr; }
    .tile { min-height: 0; }
    .two { grid-template-columns: minmax(0, 1fr); }
    .previewbox { position: static; }
    .top { padding: 8px 14px; gap: 10px; }
    .top .ttl small, .top .viewsite, .status .txt { display: none; }
    .top { position: static; }
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); position: sticky; top: 0; z-index: 10; background: #FFFFFF; border-bottom: 1px solid var(--line); }
    .tabs button { border: 0; background: none; padding: 14px 4px 12px; font-size: 12px; cursor: pointer; border-bottom: 3px solid transparent; }
    .tabs button[aria-current="page"] { border-bottom-color: var(--teal); font-weight: 700; }
    main { padding-bottom: 60px; }
  }
  .pubbar { display: none; }
  .pubbar.show { display: flex; gap: 10px; align-items: center; justify-content: space-between; background: #FFF8E1; border-top: 1px solid #F2D27A; padding: 10px 16px; }
  @media (min-width: 861px) { .pubbar.show { display: none; } }
</style>
</head>
<body>
<header class="top">
  <img src="logos/circle_teal.svg" alt="">
  <div class="ttl">Studio admin<small>Dance &amp; All That Jazz</small></div>
  <div class="sp"></div>
  <div class="status" id="status" aria-live="polite"></div>
  <button class="btn ghost" id="discardTop" type="button">Discard</button>
  <button class="btn primary" id="publishTop" type="button">Publish</button>
  <a class="viewsite" href="index.html" target="_blank" rel="noopener">View site ↗</a>
</header>
<nav class="tabs" id="tabs" aria-label="Admin sections"></nav>
<div class="wrap">
  <nav class="side" id="side" aria-label="Admin sections"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  // ---------- storage: draft vs live ----------
  // The website reads 'datj-admin'. Edits here save to a draft until Brittany presses Publish.
  const LIVE = 'datj-admin', DRAFT = 'datj-admin-draft';
  const read = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('Couldn’t save — the photo may be too big.'); return false; } };

  const RC0 = [
    ['Date & venue', 'Placeholder: date, time and venue address.', '', '', 'Placeholder: venue name and address\n- Doors open: time\n- Show starts: time\n- Parking: where to park and drop off'],
    ['Tickets', 'Placeholder: on-sale date and price.', 'Buy tickets', 'https://example.com/tickets', ''],
    ['Costumes', 'Placeholder: fee, sizing and pickup.', '', '', 'Placeholder: costume fee and when it is due\n- Sizing night: date\n- Pickup: date and place\n- Label every piece with your dancer’s name'],
    ['Dress rehearsal', 'Placeholder: date and what to bring.', '', '', 'Placeholder: rehearsal date and location\n- Arrival times by class\n- Bring: costumes, shoes, tights, hair supplies\n- Parents: where to wait'],
    ['Picture day', 'Placeholder: date and schedule.', '', '', 'Placeholder: picture day date\n- Photo times by class\n- Come in full costume, hair and makeup done\n- How to order prints'],
    ['Show-day checklist', 'Placeholder: hair, makeup, arrival time.', '', '', '- Hair: style for each class\n- Makeup: what to wear\n- Arrival and drop-off time\n- Snacks, water, a cover-up over costumes']
  ].map(r => ({ t: r[0], d: r[1], label: r[2], url: r[3], more: r[4] }));
  const STAFF0 = [['Brittany', 'Owner'], ['Katie', ''], ['Meghan', ''], ['Kelly', ''], ['Dillon', ''], ['Daniel', ''], ['Lauren', ''], ['Akanksha', ''], ['Shetal', ''], ['Front desk', 'Name & role', 'Studio team']]
    .map(x => ({ name: x[0], role: x[1], tag: x[2] || '', bio: '', photo: '' }));
  const DEFAULTS = { recital: false, banner: { text: 'Holiday gift cards & merch are here', href: 'H-Shop.dc.html' }, rc: RC0, staff: STAFF0 };
  const pick = (o) => ({ recital: !!o.recital, banner: Object.assign({}, DEFAULTS.banner, o.banner || {}), rc: (o.rc && o.rc.length ? o.rc : RC0).map(r => Object.assign({ t: '', d: '', label: '', url: '', more: '' }, r)), staff: (o.staff && o.staff.length ? o.staff : STAFF0).map(s => Object.assign({ name: '', role: '', tag: '', bio: '', photo: '' }, s)) });
  const clone = (x) => JSON.parse(JSON.stringify(x));

  let live = pick(Object.assign({}, DEFAULTS, read(LIVE) || {}));
  let draft = pick(read(DRAFT) || live);
  const dirty = () => JSON.stringify(draft) !== JSON.stringify(live);
  const saveDraft = () => { write(DRAFT, draft); status(); };

  // ---------- helpers ----------
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = (id) => document.getElementById(id);
  let tt; const toast = (m) => { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); };
  const LINKS = [['Gift Cards & Shop', 'H-Shop.dc.html'], ['Classes', 'H-Classes.dc.html'], ['Pricing', 'H-Pricing.dc.html'], ['Company', 'H-Company.dc.html'], ['Current Families', 'H-Families.dc.html']];
  const SITE = { 'H-Shop.dc.html': 'shop.html', 'H-Classes.dc.html': 'classes.html', 'H-Pricing.dc.html': 'pricing.html', 'H-Company.dc.html': 'company.html', 'H-Families.dc.html': 'families.html' };
  const moreHtml = (txt) => { const lines = String(txt || '').split('\n').map(l => l.trim()).filter(Boolean); let out = '', ul = [];
    const flush = () => { if (ul.length) { out += '<ul>' + ul.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'; ul = []; } };
    lines.forEach(l => { if (/^- /.test(l)) ul.push(l.slice(2)); else { flush(); out += '<p>' + esc(l) + '</p>'; } }); flush(); return out; };
  const field = (id, label, value, max, opts) => { opts = opts || {}; const n = String(value || '').length; const tag = opts.area ? 'textarea' : 'input';
    return '<label class="field" for="' + id + '"><span class="row"><span>' + esc(label) + (opts.optional ? ' <span class="count">(optional)</span>' : '') + '</span>' + (max ? '<span class="count' + (n > max * 0.9 ? ' near' : '') + '" id="' + id + '-n">' + n + ' / ' + max + '</span>' : '') + '</span>'
      + (opts.area ? '<textarea id="' + id + '" maxlength="' + max + '" placeholder="' + esc(opts.ph || '') + '">' + esc(value) + '</textarea>'
                   : '<input type="' + (opts.type || 'text') + '" id="' + id + '"' + (max ? ' maxlength="' + max + '"' : '') + ' value="' + esc(value) + '" placeholder="' + esc(opts.ph || '') + '">')
      + (opts.hint ? '<div class="hint">' + opts.hint + '</div>' : '') + '</label>'; };
  // live-typing: update the model + counter + preview without redrawing the field being typed in
  const bind = (id, max, set, after) => { const el = $(id); if (!el) return; el.addEventListener('input', () => { set(el.value); const c = $(id + '-n'); if (c) { c.textContent = el.value.length + ' / ' + max; c.classList.toggle('near', el.value.length > max * 0.9); } saveDraft(); if (after) after(); }); };

  // ---------- Studio Pro classes, for "styles they teach" ----------
  let CLASSES = (window.DATJ_CLASSES && window.DATJ_CLASSES.classes) || [];
  const TEACH = window.DATJ_TEACHERS || {};
  const styleOf = (n) => { const r = []; const t = n.toLowerCase();
    if (/tiny tots|disney|basics|tiny tap/.test(t)) r.push('Tiny Tots & Preschool'); if (/ballet|pointe|combo/.test(t)) r.push('Ballet'); if (/jazz|combo/.test(t)) r.push('Jazz'); if (/tap/.test(t)) r.push('Tap');
    if (/hip hop/.test(t)) r.push('Hip Hop'); if (/break/.test(t)) r.push('Breaking'); if (/acro/.test(t)) r.push('Acro'); if (/contemporary|modern|lyrical/.test(t)) r.push('Contemporary');
    if (/musical/.test(t)) r.push('Musical Theater'); if (/bollywood/.test(t)) r.push('Bollywood'); return r; };
  const stylesFor = (name) => { const st = []; CLASSES.filter(c => TEACH[c.key] === name).forEach(c => styleOf(c.name).forEach(x => { if (!st.includes(x)) st.push(x); })); return st; };
  const classCount = (name) => CLASSES.filter(c => TEACH[c.key] === name).length;

  // ---------- navigation ----------
  const PAGES = [
    { id: 'home', label: 'Home', short: 'Home' },
    { id: 'banner', label: 'Top banner', short: 'Banner' },
    { id: 'recital', label: 'Recital season', short: 'Recital' },
    { id: 'staff', label: 'Instructors', short: 'Instructors' }
  ];
  const SOON = ['Homepage cards', 'Class prices', 'Menu & header', 'Photos & videos'];
  let page = (location.hash || '#home').slice(1); if (!PAGES.some(p => p.id === page)) page = 'home';
  let openItem = -1, confirmDel = -1;
  const go = (p) => { page = p; openItem = -1; confirmDel = -1; history.replaceState(null, '', '#' + p); render(); window.scrollTo(0, 0); };

  function navs() {
    $('side').innerHTML = '<div class="grp">Your site</div>' + PAGES.map(p => '<button type="button" data-go="' + p.id + '"' + (p.id === page ? ' aria-current="page"' : '') + '>' + esc(p.label) + '</button>').join('')
      + '<div class="grp">Coming next</div>' + SOON.map(s => '<button type="button" class="soon" disabled>' + esc(s) + '<em>Soon</em></button>').join('');
    $('tabs').innerHTML = PAGES.map(p => '<button type="button" data-go="' + p.id + '"' + (p.id === page ? ' aria-current="page"' : '') + '>' + esc(p.short) + '</button>').join('');
  }
  function status() {
    const d = dirty();
    $('status').innerHTML = d ? '<span class="dot on"></span><span class="txt">Changes not live yet</span>' : '<span class="dot ok"></span><span class="txt">Everything is live</span>';
    $('publishTop').disabled = !d; $('discardTop').style.visibility = d ? 'visible' : 'hidden';
  }
  function publish() {
    const cur = read(LIVE) || {};
    if (!write(LIVE, Object.assign(cur, clone(draft)))) return;
    live = pick(read(LIVE)); localStorage.removeItem(DRAFT); status(); toast('Published. Your changes are on the site.');
  }
  function discard() { draft = clone(live); localStorage.removeItem(DRAFT); render(); toast('Changes discarded.'); }

  // ---------- pages ----------
  function vHome() {
    const missing = draft.staff.filter(s => !s.bio.trim()).length, noPhoto = draft.staff.filter(s => !s.photo).length;
    const bannerTo = (LINKS.find(l => l[1] === draft.banner.href) || ['a page'])[0];
    return '<h1>Hi Brittany.</h1><p class="lede">What would you like to update? Changes stay private until you press <b>Publish</b>.</p>'
      + '<div class="tiles">'
      + '<button class="tile" type="button" data-go="banner"><b>Post an announcement</b><span>The teal line across the top of every page.</span><span class="now">Now: “' + esc(draft.banner.text) + '” → ' + esc(bannerTo) + '</span></button>'
      + '<button class="tile" type="button" data-go="recital"><b>Recital season</b><span>Turn on recital info for families, and edit the recital cards.</span><span class="now">Now: ' + (draft.recital ? 'On' : 'Off') + '</span></button>'
      + '<button class="tile" type="button" data-go="staff"><b>Instructors</b><span>Photos and bios on the About page.</span><span class="now">' + draft.staff.length + ' people · ' + (missing ? missing + ' need a bio' : 'all bios done') + (noPhoto ? ' · ' + noPhoto + ' need a photo' : '') + '</span></button>'
      + SOON.map(s => '<div class="tile soon"><b>' + esc(s) + '</b><span>Coming next.</span></div>').join('')
      + '</div>'
      + '<div class="auto"><div><b>You don’t need to update these here</b><ul><li>Classes, days, times and ages: change them in Studio Pro and the website updates by itself.</li><li>Free trial sign-ups: they go straight into Studio Pro.</li></ul></div></div>';
  }

  function bannerPreview() {
    return '<div class="lbl">How it looks</div>'
      + '<div class="pv-banner"><span>Prospect Heights, Illinois</span><b>' + (draft.recital ? 'Recital season · tickets, costumes &amp; schedule →' : esc(draft.banner.text || 'Your message') + ' →') + '</b></div>'
      + '<div class="pv-head"><span class="logo"></span>Dance &amp; All That Jazz</div>'
      + '<p class="pv-note">' + (draft.recital ? '<b>Recital season is on</b>, so the banner shows the recital link. Your message comes back when you turn it off.' : 'On phones the banner shows “Parent Portal” instead, so keep anything urgent on the homepage too.') + '</p>';
  }
  function vBanner() {
    return '<h1>Top banner</h1><p class="lede">A short line across the top of every page. Good for a sale, a closure or a deadline.</p>'
      + '<div class="two"><div class="panel">'
      + field('bText', 'Message', draft.banner.text, 60, { ph: 'e.g. Registration for Session 3 is open', hint: 'Keep it short. It’s shown in small capital letters.' })
      + '<div class="field"><div class="row"><span>When someone taps it, go to</span></div><div class="chips" role="group" aria-label="Banner link">'
      + LINKS.map(l => '<button type="button" class="chip" data-link="' + l[1] + '" aria-pressed="' + (draft.banner.href === l[1]) + '">' + esc(l[0]) + '</button>').join('') + '</div></div>'
      + '</div><div class="previewbox" id="pv">' + bannerPreview() + '</div></div>';
  }

  function rcPreview(r) {
    return '<div class="lbl">How the card looks</div><div class="pv-card"><div class="bd"><h3>' + esc(r.t || 'Card title') + '</h3><p>' + esc(r.d || 'Short details') + '</p><div class="acts">'
      + (r.label && r.url ? '<span class="lnk">' + esc(r.label) + ' ' + (/^https?:/.test(r.url) ? '↗' : '→') + '</span>' : '') + (r.more.trim() ? '<span class="more">More details →</span>' : '') + '</div></div></div>'
      + (r.more.trim() ? '<div class="pv-slide"><div class="tg">Recital</div><h3>' + esc(r.t) + '</h3><p>' + esc(r.d) + '</p>' + moreHtml(r.more) + '</div><p class="pv-note">This opens when parents tap “More details.”</p>' : '<p class="pv-note">Add “More details” to give this card a slide-out panel.</p>');
  }
  function vRecital() {
    const sw = '<button type="button" class="switch" role="switch" id="recSw" aria-checked="' + draft.recital + '"><span class="knob"></span><span><b>Recital season is ' + (draft.recital ? 'on' : 'off') + '</b><span>' + (draft.recital ? 'Families see a recital link in the top banner and the menu.' : 'Turn on when you’re ready to share recital tickets, costumes and schedule.') + '</span></span></button>';
    const list = draft.rc.map((r, i) => {
      const row = '<div class="item' + (openItem === i ? ' open' : '') + '"><button type="button" class="main" data-open="' + i + '" aria-expanded="' + (openItem === i) + '"><b>' + esc(r.t || 'Untitled card') + '</b><span>' + esc(r.d) + '</span></button>'
        + (/placeholder/i.test(r.d + r.more) ? '<span class="tag">Placeholder</span>' : '') + '<button type="button" class="mini" data-open="' + i + '" aria-label="Edit ' + esc(r.t) + '">✎</button></div>';
      if (openItem !== i) return row;
      return row + '<div class="editor"><div class="two"><div>'
        + field('rT', 'Title', r.t, 28) + field('rD', 'Short details', r.d, 140, { area: true, hint: 'One or two sentences on the card itself.' })
        + field('rM', 'More details', r.more, 600, { area: true, optional: true, ph: 'Extra info for the slide-out panel', hint: 'Start a line with “- ” to make a bullet. Leave empty for no panel.' })
        + field('rL', 'Button text', r.label, 20, { optional: true, ph: 'e.g. Buy tickets' })
        + field('rU', 'Button link', r.url, 300, { optional: true, type: 'url', ph: 'https://…', hint: 'Both button text and link are needed for a button to show.' })
        + '<button type="button" class="btn dark" data-close="1">Done</button>'
        + '</div><div class="previewbox" id="pv">' + rcPreview(r) + '</div></div></div>';
    }).join('');
    return '<h1>Recital season</h1><p class="lede">One switch for the season, plus the six recital cards on the Current Families page.</p>'
      + sw + '<h2 style="margin-top: 30px;">Recital cards</h2><p class="lede" style="margin-bottom: 14px;">Tap a card to edit it.</p><div class="list">' + list + '</div>';
  }

  function staffPreview(s) {
    const st = stylesFor(s.name); const sub = s.role || st.join(' · ') || 'Styles taught';
    const img = s.photo ? '<img src="' + esc(s.photo) + '" alt="">' : 'Photo: headshot';
    return '<div class="lbl">On the About page</div><div class="pv-card"><div class="ph">' + img + '</div><div class="bd"><h3>' + esc(s.name || 'Name') + '</h3><p>' + esc(sub) + '</p><div class="acts"><span class="more">Read bio →</span></div></div></div>'
      + '<div class="pv-slide"><div class="photo">' + (s.photo ? '<img src="' + esc(s.photo) + '" alt="">' : '') + '</div><div class="tg">' + esc(s.tag || 'Instructor') + '</div><h3>' + esc(s.name || 'Name') + '</h3><p>' + esc(sub) + '</p>'
      + (s.bio.trim() ? moreHtml(s.bio) : '<p style="color: #999999;">Bio goes here.</p>') + (st.length ? '<ul><li>Teaches: ' + esc(st.join(', ')) + '</li></ul>' : '') + '</div>';
  }
  function vStaff() {
    const n = draft.staff.length;
    const list = draft.staff.map((s, i) => {
      const thumb = '<span class="thumb">' + (s.photo ? '<img src="' + esc(s.photo) + '" alt="">' : 'Photo') + '</span>';
      const st = stylesFor(s.name);
      const row = '<div class="item' + (openItem === i ? ' open' : '') + '">' + thumb + '<button type="button" class="main" data-open="' + i + '" aria-expanded="' + (openItem === i) + '"><b>' + esc(s.name || 'New instructor') + '</b><span>' + esc(s.role || st.join(' · ') || '—') + '</span></button>'
        + (!s.bio.trim() ? '<span class="tag">Needs bio</span>' : '')
        + '<button type="button" class="mini" data-up="' + i + '" aria-label="Move ' + esc(s.name) + ' up"' + (i === 0 ? ' disabled' : '') + '>↑</button><button type="button" class="mini" data-down="' + i + '" aria-label="Move ' + esc(s.name) + ' down"' + (i === n - 1 ? ' disabled' : '') + '>↓</button></div>';
      if (openItem !== i) return row;
      const cc = classCount(s.name);
      return row + '<div class="editor"><div class="two"><div>'
        + '<div class="field"><div class="row"><span>Photo</span></div><div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;"><label class="btn" for="sPhoto">' + (s.photo ? 'Change photo' : 'Add photo') + '</label><input type="file" id="sPhoto" accept="image/*" class="sr">' + (s.photo ? '<button type="button" class="btn ghost" id="sPhotoX">Remove</button>' : '') + '</div><div class="hint">A headshot works best. It’s cropped to a tall rectangle.</div></div>'
        + field('sT', 'Label above the name', s.tag, 20, { optional: true, ph: 'Instructor', hint: 'The small teal word over their name in the bio, e.g. Owner, Instructor, Studio team.' })
        + field('sN', 'Name', s.name, 24, { hint: 'First name, as families know them.' })
        + field('sR', 'Title or styles', s.role, 40, { optional: true, ph: st.join(' · ') || 'e.g. Owner', hint: 'Leave empty to show the styles they teach.' })
        + field('sB', 'Bio', s.bio, 600, { area: true, ph: 'Two or three sentences: training, what they love teaching, a fun fact.', hint: 'Start a line with “- ” to make a bullet.' })
        + '<div class="field"><div class="row"><span>Styles they teach</span></div>' + (st.length ? '<div class="styles">' + st.map(x => '<span>' + esc(x) + '</span>').join('') + '</div><div class="hint">From the class schedule (' + cc + ' class' + (cc === 1 ? '' : 'es') + '). Updates by itself.</div>' : '<div class="hint">No classes on the schedule with this name.</div>') + '</div>'
        + '<div style="display: flex; gap: 10px; flex-wrap: wrap;"><button type="button" class="btn dark" data-close="1">Done</button><button type="button" class="btn ghost" data-del="' + i + '">Remove from site</button></div>'
        + (confirmDel === i ? '<div class="confirm" role="alert"><span>Remove ' + esc(s.name || 'this person') + ' from the About page?</span><button type="button" class="btn dark" data-delyes="' + i + '">Remove</button><button type="button" class="btn ghost" data-delno="1">Keep</button></div>' : '')
        + '</div><div class="previewbox" id="pv">' + staffPreview(s) + '</div></div></div>';
    }).join('');
    return '<h1>Instructors</h1><p class="lede">The Meet the team section on the About page. Tap a person to add their photo and bio. Use the arrows to change the order.</p>'
      + '<div class="list">' + list + '</div><button type="button" class="btn" id="sAdd" style="margin-top: 14px;">+ Add a person</button>';
  }

  // ---------- render + events ----------
  function render() {
    navs(); status();
    $('main').innerHTML = page === 'banner' ? vBanner() : page === 'recital' ? vRecital() : page === 'staff' ? vStaff() : vHome();
    const pv = () => $('pv');
    if (page === 'banner') bind('bText', 60, v => draft.banner.text = v, () => pv().innerHTML = bannerPreview());
    if (page === 'recital' && openItem >= 0) { const r = draft.rc[openItem]; const up = () => pv().innerHTML = rcPreview(r);
      bind('rT', 28, v => r.t = v, up); bind('rD', 140, v => r.d = v, up); bind('rM', 600, v => r.more = v, up); bind('rL', 20, v => r.label = v, up); bind('rU', 300, v => r.url = v.trim(), up); }
    if (page === 'staff' && openItem >= 0) { const s = draft.staff[openItem]; const up = () => pv().innerHTML = staffPreview(s);
      bind('sN', 24, v => s.name = v, up); bind('sT', 20, v => s.tag = v, up); bind('sR', 40, v => s.role = v, up); bind('sB', 600, v => s.bio = v, () => { up(); const tg = document.querySelector('.item.open .tag'); if (tg) tg.style.display = s.bio.trim() ? 'none' : ''; });
      const f = $('sPhoto'); if (f) f.addEventListener('change', () => { const file = f.files && f.files[0]; if (!file) return; shrink(file, (url) => { s.photo = url; saveDraft(); render(); }); }); }
  }
  // resize photos in the browser so they stay small
  function shrink(file, done) {
    const img = new Image(); const r = new FileReader();
    r.onload = () => { img.onload = () => { const W = 480, H = 600, c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
      const s = Math.max(W / img.width, H / img.height), w = img.width * s, h = img.height * s; g.drawImage(img, (W - w) / 2, (H - h) / 2, w, h); done(c.toDataURL('image/jpeg', 0.82)); };
      img.onerror = () => toast('That file doesn’t look like a photo.'); img.src = r.result; };
    r.readAsDataURL(file);
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, [data-go]'); if (!t) return;
    const d = t.dataset;
    if (d.go) return go(d.go);
    if (t.id === 'publishTop' || t.id === 'publishBar') return publish();
    if (t.id === 'discardTop' || t.id === 'discardBar') return discard();
    if (d.link) { draft.banner.href = d.link; saveDraft(); render(); return; }
    if (t.id === 'recSw') { draft.recital = !draft.recital; saveDraft(); render(); return; }
    if (d.open !== undefined) { const i = +d.open; openItem = openItem === i ? -1 : i; confirmDel = -1; render(); return; }
    if (d.close) { openItem = -1; confirmDel = -1; render(); return; }
    if (d.up !== undefined || d.down !== undefined) { const i = +(d.up !== undefined ? d.up : d.down), j = d.up !== undefined ? i - 1 : i + 1; const a = draft.staff; [a[i], a[j]] = [a[j], a[i]]; if (openItem === i) openItem = j; else if (openItem === j) openItem = i; saveDraft(); render(); return; }
    if (t.id === 'sPhotoX') { draft.staff[openItem].photo = ''; saveDraft(); render(); return; }
    if (d.del !== undefined) { confirmDel = +d.del; render(); return; }
    if (d.delno) { confirmDel = -1; render(); return; }
    if (d.delyes !== undefined) { const nm = draft.staff[+d.delyes].name; draft.staff.splice(+d.delyes, 1); openItem = -1; confirmDel = -1; saveDraft(); render(); toast(nm + ' removed. Press Publish to update the site.'); return; }
    if (t.id === 'sAdd') { draft.staff.push({ name: '', role: '', tag: '', bio: '', photo: '' }); openItem = draft.staff.length - 1; saveDraft(); render(); const n = $('sN'); if (n) n.focus(); return; }
  });

  render();
})();
</script>
</body>
</html>
