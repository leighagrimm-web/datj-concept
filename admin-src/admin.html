<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio admin — Dance &amp; All That Jazz</title>
<style>
  :root { --teal: #00ADB5; --teal-dark: #007A80; --ink: #111111; --mut: #5C6360; --line: #E2E4E3; --bg: #F5F6F5; }
  * { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--ink); background: var(--bg); font-size: 15px; line-height: 1.5; }
  button, input, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  .serif { font-family: Georgia, serif; font-style: italic; font-weight: 400; }

  /* top bar */
  .top { position: sticky; top: 0; z-index: 10; background: #000000; color: #FFFFFF; display: flex; align-items: center; gap: 14px; padding: 10px 20px; min-height: 60px; }
  .top img { width: 38px; height: 38px; }
  .top .ttl { font-weight: 800; letter-spacing: -0.02em; font-size: 17px; }
  .top .ttl small { display: block; font-weight: 400; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #9FA7A4; }
  .top .sp { flex: 1; }
  .top .viewsite { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; text-decoration: none; padding: 10px 12px; border: 1px solid #444444; }
  .status { font-size: 12px; color: #CFD6D3; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #5C6360; display: inline-block; }
  .dot.on { background: #F2B705; }
  .dot.ok { background: var(--teal); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 1px solid var(--ink); background: #FFFFFF; color: var(--ink); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--teal); border-color: var(--teal); color: #000000; }
  .btn.dark { background: var(--ink); color: #FFFFFF; }
  .btn.ghost { border-color: transparent; background: transparent; text-decoration: underline; text-underline-offset: 3px; padding: 0 8px; }
  .btn[disabled] { opacity: 0.4; cursor: default; }
  .top .btn.ghost { color: #CFD6D3; }

  /* layout */
  .wrap { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: calc(100vh - 60px); }
  nav.side { background: #FFFFFF; border-right: 1px solid var(--line); padding: 18px 12px; }
  nav.side button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px; border: 0; background: none; cursor: pointer; font-size: 14px; border-left: 3px solid transparent; }
  nav.side button[aria-current="page"] { background: #EAF7F7; border-left-color: var(--teal); font-weight: 700; }
  nav.side .grp { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mut); margin: 18px 12px 6px; }
  nav.side .soon { color: #9AA19E; cursor: default; }
  nav.side .soon em { font-style: normal; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-left: auto; }
  main { padding: 32px 4vw 80px; max-width: 1180px; }
  h1 { font-size: 40px; letter-spacing: -0.045em; line-height: 1.05; margin: 0 0 8px; font-weight: 800; }
  h2 { font-size: 20px; letter-spacing: -0.02em; margin: 0 0 6px; }
  .lede { color: var(--mut); margin: 0 0 26px; max-width: 620px; }
  .panel { background: #FFFFFF; border: 1px solid var(--line); padding: 22px; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.9fr); gap: 22px; align-items: start; }
  .lbl { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--mut); margin: 0 0 8px; }
  .previewbox { position: sticky; top: 84px; }

  /* home tiles */
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .tile { text-align: left; background: #FFFFFF; border: 1px solid var(--line); padding: 22px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-height: 170px; }
  .tile:hover { border-color: var(--ink); }
  .tile b { font-size: 19px; letter-spacing: -0.02em; }
  .tile span { color: var(--mut); font-size: 14px; }
  .tile .now { margin-top: auto; font-size: 12px; color: var(--ink); background: var(--bg); padding: 8px 10px; }
  .tile.soon { cursor: default; opacity: 0.55; }
  .auto { margin-top: 26px; display: flex; gap: 16px; align-items: flex-start; background: #FFFFFF; border: 1px solid var(--line); border-left: 4px solid var(--teal); padding: 18px 20px; }
  .auto ul { margin: 6px 0 0; padding-left: 18px; color: var(--mut); }

  /* form fields */
  .field { display: block; margin: 0 0 18px; }
  .field .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .field .count { font-weight: 400; font-size: 12px; color: var(--mut); }
  .field .count.near { color: #B26A00; }
  .field input[type=text], .field input[type=url], .field textarea { display: block; width: 100%; padding: 12px; border: 1px solid #C9CDCB; background: #FFFFFF; font-size: 15px; }
  .field textarea { min-height: 120px; resize: vertical; }
  .field input:focus, .field textarea:focus { outline: 2px solid var(--teal); outline-offset: 0; border-color: var(--teal); }
  .hint { font-size: 12px; color: var(--mut); margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-height: 40px; padding: 0 14px; border: 1px solid #C9CDCB; background: #FFFFFF; cursor: pointer; font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }

  /* switch */
  .switch { display: flex; align-items: center; gap: 16px; padding: 18px; border: 1px solid var(--line); background: #FFFFFF; cursor: pointer; width: 100%; text-align: left; }
  .switch .knob { flex: none; width: 58px; height: 32px; border-radius: 16px; background: #C9CDCB; position: relative; transition: background 0.15s; }
  .switch .knob::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; transition: left 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,0.25); }
  .switch[aria-checked="true"] .knob { background: var(--teal); }
  .switch[aria-checked="true"] .knob::after { left: 29px; }
  .switch b { display: block; font-size: 17px; }
  .switch span { color: var(--mut); font-size: 13px; }

  /* list rows */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; align-items: center; gap: 14px; background: #FFFFFF; border: 1px solid var(--line); padding: 12px 14px; }
  .item.open { border-color: var(--ink); }
  .item .main { flex: 1; min-width: 0; cursor: pointer; background: none; border: 0; text-align: left; padding: 4px 0; }
  .item .main b { display: block; }
  .item .main span { color: var(--mut); font-size: 13px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thumb { width: 48px; height: 60px; background: #1C1C1C; flex: none; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #777777; font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .mini { width: 36px; height: 36px; border: 1px solid #C9CDCB; background: #FFFFFF; cursor: pointer; font-size: 15px; }
  .mini[disabled] { opacity: 0.3; cursor: default; }
  .tag { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; padding: 3px 7px; background: #FFF3CC; color: #7A5A00; white-space: nowrap; }
  .editor { background: #FFFFFF; border: 1px solid var(--ink); border-top: 0; padding: 20px; margin: -8px 0 0; }
  .confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: #FFF3F3; border: 1px solid #F0C9C9; padding: 12px 14px; margin-top: 14px; }

  /* previews (look like the site) */
  .pv-note { font-size: 12px; color: var(--mut); margin-top: 10px; }
  .pv-banner span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pv-banner { height: 34px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: var(--teal); color: #000000; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; gap: 12px; }
  .pv-banner b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pv-head { background: #000000; color: #FFFFFF; height: 56px; display: flex; align-items: center; padding: 0 16px; gap: 10px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; }
  .pv-head .logo { width: 30px; height: 30px; border-radius: 50%; background: var(--teal); }
  .pv-card { background: #F2F2F2; display: flex; flex-direction: column; max-width: 300px; }
  .pv-card .ph { height: 190px; background: #1C1C1C; display: flex; align-items: center; justify-content: center; color: #888888; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; overflow: hidden; }
  .pv-card .ph img { width: 100%; height: 100%; object-fit: cover; }
  .pv-card .bd { padding: 20px; }
  .pv-card h3 { font-size: 21px; letter-spacing: -0.035em; margin: 0 0 6px; }
  .pv-card p { font-size: 13px; color: #555555; margin: 0; }
  .pv-card .acts { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
  .pv-card .lnk { display: inline-block; padding: 10px 12px; background: #111111; color: #FFFFFF; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; }
  .pv-card .more { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; border-bottom: 1px solid #111111; padding-bottom: 2px; }
  .pv-slide { background: #FFFFFF; border: 1px solid var(--line); padding: 22px; margin-top: 14px; }
  .pv-slide .tg { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--teal-dark); font-weight: 700; margin-bottom: 6px; }
  .pv-slide h3 { font-size: 30px; letter-spacing: -0.05em; margin: 0 0 10px; line-height: 1; }
  .pv-slide p { font-size: 14px; color: #333333; margin: 0 0 10px; }
  .pv-slide ul { margin: 0; padding-left: 18px; font-size: 14px; color: #333333; }
  .pv-slide .photo { width: 150px; aspect-ratio: 4 / 5; background: #1C1C1C; margin-bottom: 14px; overflow: hidden; }
  .pv-slide .photo img { width: 100%; height: 100%; object-fit: cover; }
  .styles { display: flex; flex-wrap: wrap; gap: 6px; }
  .styles span { font-size: 12px; padding: 4px 9px; background: #EAF7F7; color: #00575B; }

  select.pick { display: block; width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid #C9CDCB; background: #FFFFFF; font-size: 15px; }
  select.pick:focus { outline: 2px solid var(--teal); outline-offset: 0; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 12px; }
  .tiers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .tier { background: var(--bg); padding: 12px; }
  .tier b { display: block; font-size: 13px; margin-bottom: 6px; }
  .money { display: flex; align-items: center; border: 1px solid #C9CDCB; background: #FFFFFF; }
  .money span { padding: 0 0 0 10px; color: var(--mut); }
  .money input { border: 0; padding: 10px 10px 10px 4px; width: 100%; font-size: 15px; min-width: 0; }
  .money input:focus { outline: none; }
  .money:focus-within { outline: 2px solid var(--teal); }
  .ptable { width: 100%; border-collapse: collapse; background: #FFFFFF; }
  .ptable th { text-align: left; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mut); padding: 10px 12px; border-bottom: 1px solid var(--line); background: #FFFFFF; position: sticky; top: 0; }
  .ptable td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 14px; }
  .ptable td.cls b { display: block; }
  .ptable td.cls span { color: var(--mut); font-size: 12px; }
  .ptable .money { max-width: 120px; }
  .ptable .src { font-size: 12px; color: var(--mut); }
  .ptable .src.ovr { color: #7A5A00; font-weight: 700; }
  .search { display: block; width: 100%; max-width: 360px; padding: 12px; border: 1px solid #C9CDCB; margin: 0 0 12px; font-size: 15px; }
  .navrow { display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid var(--line); padding: 10px 14px; }
  .navrow b { flex: 1; }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; padding: 8px 0; }
  .check input { width: 20px; height: 20px; accent-color: var(--teal); }
  .pv-nav { background: #000000; color: #E4E8E5; display: flex; align-items: center; gap: 18px; padding: 16px; flex-wrap: wrap; font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; }
  .pv-nav .logo { width: 34px; height: 34px; border-radius: 50%; background: var(--teal); }
  .pv-nav .tr { margin-left: auto; background: var(--teal); color: #000000; padding: 8px 10px; font-weight: 700; }
  .pv-menu { background: #000000; color: #FFFFFF; padding: 18px; margin-top: 12px; }
  .pv-menu div { font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: -0.03em; line-height: 1.4; }
  .slot { display: flex; gap: 16px; align-items: center; background: #FFFFFF; border: 1px solid var(--line); padding: 14px; }
  .slot .thumb { width: 96px; height: 72px; }
  .slot .info { flex: 1; min-width: 0; }
  .slot .info b { display: block; }
  .slot .info span { color: var(--mut); font-size: 13px; }
  .note { background: #FFFFFF; border: 1px solid var(--line); border-left: 4px solid #F2B705; padding: 14px 16px; margin: 0 0 14px; font-size: 14px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111111; color: #FFFFFF; padding: 12px 18px; font-size: 14px; z-index: 30; display: none; }
  .toast.show { display: block; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* phone */
  .tabs { display: none; }
  @media (max-width: 860px) {
    .wrap { grid-template-columns: minmax(0, 1fr); }
    .top .btn { min-height: 38px; padding: 0 12px; font-size: 11px; }
    .top .ttl { font-size: 15px; }
    .status { display: none; }
    .item { flex-wrap: wrap; }
    .item .main { flex-basis: 60%; }
    .editor { padding: 16px; }
    .item .mini[data-open] { display: none; }
    nav.side { display: none; }
    main { padding: 22px 18px 60px; }
    h1 { font-size: 32px; }
    .tiles { grid-template-columns: 1fr; }
    .tile { min-height: 0; }
    .two { grid-template-columns: minmax(0, 1fr); }
    .previewbox { position: static; }
    .top { padding: 8px 14px; gap: 10px; }
    .top .ttl small, .top .viewsite, .status .txt { display: none; }
    .top { position: static; }
    .tabs { display: flex; overflow-x: auto; position: sticky; top: 0; z-index: 10; background: #FFFFFF; border-bottom: 1px solid var(--line); scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { flex: none; border: 0; background: none; padding: 14px 14px 12px; font-size: 13px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
    .tiers { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid2 { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .ptable .hideM { display: none; }
    .slot { flex-wrap: wrap; }
    .tabs button[aria-current="page"] { border-bottom-color: var(--teal); font-weight: 700; }
    main { padding-bottom: 60px; }
  }
  .pubbar { display: none; }
  .pubbar.show { display: flex; gap: 10px; align-items: center; justify-content: space-between; background: #FFF8E1; border-top: 1px solid #F2D27A; padding: 10px 16px; }
  @media (min-width: 861px) { .pubbar.show { display: none; } }
</style>
</head>
<body>
<header class="top">
  <img src="logos/circle_teal.svg" alt="">
  <div class="ttl">Studio admin<small>Dance &amp; All That Jazz</small></div>
  <div class="sp"></div>
  <div class="status" id="status" aria-live="polite"></div>
  <button class="btn ghost" id="discardTop" type="button">Discard</button>
  <button class="btn primary" id="publishTop" type="button">Publish</button>
  <a class="viewsite" href="index.html" target="_blank" rel="noopener">View site ↗</a>
</header>
<nav class="tabs" id="tabs" aria-label="Admin sections"></nav>
<div class="wrap">
  <nav class="side" id="side" aria-label="Admin sections"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  // ---------- storage: draft vs live ----------
  // The website reads 'datj-admin'. Edits here save to a draft until Brittany presses Publish.
  const LIVE = 'datj-admin', DRAFT = 'datj-admin-draft';
  const read = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('Couldn’t save — the photo may be too big.'); return false; } };

  const RC0 = [
    ['Date & venue', 'Placeholder: date, time and venue address.', '', '', 'Placeholder: venue name and address\n- Doors open: time\n- Show starts: time\n- Parking: where to park and drop off'],
    ['Tickets', 'Placeholder: on-sale date and price.', 'Buy tickets', 'https://example.com/tickets', ''],
    ['Costumes', 'Placeholder: fee, sizing and pickup.', '', '', 'Placeholder: costume fee and when it is due\n- Sizing night: date\n- Pickup: date and place\n- Label every piece with your dancer’s name'],
    ['Dress rehearsal', 'Placeholder: date and what to bring.', '', '', 'Placeholder: rehearsal date and location\n- Arrival times by class\n- Bring: costumes, shoes, tights, hair supplies\n- Parents: where to wait'],
    ['Picture day', 'Placeholder: date and schedule.', '', '', 'Placeholder: picture day date\n- Photo times by class\n- Come in full costume, hair and makeup done\n- How to order prints'],
    ['Show-day checklist', 'Placeholder: hair, makeup, arrival time.', '', '', '- Hair: style for each class\n- Makeup: what to wear\n- Arrival and drop-off time\n- Snacks, water, a cover-up over costumes']
  ].map(r => ({ t: r[0], d: r[1], label: r[2], url: r[3], more: r[4] }));
  const STAFF0 = [['Brittany', 'Owner'], ['Katie', ''], ['Meghan', ''], ['Kelly', ''], ['Dillon', ''], ['Daniel', ''], ['Lauren', ''], ['Akanksha', ''], ['Shetal', ''], ['Front desk', 'Name & role', 'Studio team']]
    .map(x => ({ name: x[0], role: x[1], tag: x[2] || '', bio: '', photo: '' }));
  const P0 = [
    { title: 'Little Movers', sub: 'Ages 18 months – 5 · rhythm, coordination & joy', cta: 'See classes', link: 'classes#schedule', photo: '', more: 'Placeholder: what little ones do in class\n- Tiny Tots: 18 months – 3, with a grown-up nearby\n- Preschool combos: ages 3–5\n- 40-minute classes, first one free' },
    { title: 'Dance Styles', sub: 'Ballet, jazz, tap, hip hop, breaking, acro & more', cta: 'See styles', link: 'classes#styles', photo: '', more: 'Placeholder: how levels work\n- Ballet, jazz, tap, hip hop, breaking, acro, contemporary, musical theater\n- Levels I–III by age and experience\n- Ages 6 through adult' },
    { title: 'Company', sub: 'Six competitive teams for dancers ready to go further', cta: 'Meet the teams', link: 'company', photo: '', more: 'Placeholder: what Company involves\n- Six teams by age and level\n- Auditions: when they happen\n- Competitions and conventions each season' }];
  const PNUM = ['01 / Foundations', '02 / Technique', '03 / Compete'];
  const FACTS0 = [['Ages', '18 months to adult'], ['Styles', 'Ballet, jazz, tap, hip hop & more'], ['Where', 'Prospect Heights, IL'], ['Try it', 'Your first class is free']];
  const HOME0 = { tagline: 'Technique, artistry and confidence for every dancer.', facts: FACTS0.map(f => ({ label: f[0], text: f[1] })), programs: P0 };
  const NAMES = { classes: 'Classes', pricing: 'Pricing', company: 'Company', about: 'About', families: 'Current Families', shop: 'Gift Cards & Shop' };
  const NAV0 = [['classes', 1], ['pricing', 1], ['company', 1], ['about', 1], ['families', 1], ['shop', 0]].map(x => ({ id: x[0], header: !!x[1] }));
  // Tuition = weekly rate x class weeks in the session (rates from Studio Pro, Session 2 fees)
  const RATES0 = { 40: 16.63, 55: 19, 70: 23.5, 85: 28.5 };
  const SPECIAL0 = [{ label: 'Intro to Breaking', match: '^intro to break', rate: 20.88 }, { label: 'Breaking I or II (2 classes a week)', match: '^breaking i+$', rate: 41.88 }, { label: 'Breaking I & II combined class', match: 'combined', rate: 0 }];
  const SESS0 = [{ name: 'Session 1', dates: '', weeks: 8 }, { name: 'Session 2', dates: 'Oct 14 – Jan 5', weeks: 9 }, { name: 'Session 3', dates: '', weeks: '' }, { name: 'Session 4', dates: '', weeks: '' }];
  const DEFAULTS = { recital: false, banner: { text: 'Holiday gift cards & merch are here', href: 'shop' }, rc: RC0, staff: STAFF0, home: HOME0, nav: NAV0, prices: { rates: RATES0, specials: SPECIAL0, sessions: SESS0, current: 1, byKey: {} }, photos: {} };
  // Saved links are page ids like "families#recital"; older saves used file names
  const normLink = (h) => { h = String(h || '').trim(); const old = /^(?:H-(\w+)\.dc|HomeH\.dc|(\w+))\.html(#[\w-]+)?$/.exec(h); if (old) return (old[1] ? old[1].toLowerCase() : !old[2] || old[2] === 'index' ? 'home' : old[2]) + (old[3] || ''); return h; };
  const mergeHome = (h) => { h = h || {}; return { tagline: h.tagline || HOME0.tagline, facts: FACTS0.map((f, i) => Object.assign({ label: f[0], text: f[1] }, ((h.facts || [])[i]) || {})), programs: P0.map((p, i) => Object.assign({}, p, ((h.programs || [])[i]) || {})) }; };
  const pick = (o) => ({ recital: !!o.recital, banner: (() => { const b = Object.assign({}, DEFAULTS.banner, o.banner || {}); b.href = normLink(b.href); return b; })(),
    home: mergeHome(o.home), nav: (o.nav && o.nav.length ? o.nav : NAV0).filter(n => NAMES[n.id]).map(n => ({ id: n.id, header: !!n.header })),

        + '<button type="button" class="btn dark" data-close="1">Done</button></div><div class="previewbox" id="pv">' + progPreview(p, i) + '</div></div></div>';
    }).join('');
    return '<h1>Homepage</h1><p class="lede">The words under the big “Move with purpose” headline, the quick facts, and the three program cards.</p>'
      + '<div class="two"><div class="panel">' + field('hTag', 'Line under the headline', h.tagline, 80) + facts + '</div><div class="previewbox"><div class="lbl">How it looks</div><div id="pvHero" style="background: #000000; color: #FFFFFF; padding: 22px;">' + heroPreview() + '</div></div></div>'
      + '<h2 style="margin-top: 30px;">Program cards</h2><p class="lede" style="margin-bottom: 14px;">Tap a card to edit it. The numbers (01, 02, 03) stay as they are.</p><div class="list">' + list + '</div>';
  }
  function heroPreview() { const h = draft.home;
    return '<div style="font-size: 34px; font-weight: 800; letter-spacing: -0.05em; line-height: 0.95;">Move<br>with <span class="serif" style="color: #00ADB5;">purpose.</span></div><p style="color: #E2E7E4; font-size: 14px; margin: 12px 0 16px;">' + esc(h.tagline) + '</p>'
      + '<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; border-top: 1px solid rgba(255,255,255,0.25); padding-top: 12px; font-size: 13px;">' + h.facts.map(f => '<div><span style="display: block; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: #00ADB5;">' + esc(f.label) + '</span>' + esc(f.text) + '</div>').join('') + '</div>'; }

  // Prices
  const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const regular = () => CLASSES.filter(c => !c.season || /session|summer|intensive|camp/i.test(c.season)).sort((a, b) => DAYS.indexOf(a.day) - DAYS.indexOf(b.day) || (a.start || 0) - (b.start || 0));
  const curSess = () => draft.prices.sessions[draft.prices.current] || draft.prices.sessions[0] || { name: 'Session', weeks: '' };
  const forWeeks = (rate, wk) => Math.round((+rate || 0) * (+wk || 0));
  const money = (n) => '$' + (Math.round(n * 100) % 100 ? (+n).toFixed(2) : Math.round(n));
  const lenRate = (m) => { const R = draft.prices.rates, ks = Object.keys(R).map(Number).sort((a, b) => a - b); if (m == null) m = 55; let best = ks[0]; ks.forEach(k => { if (Math.abs(k - m) < Math.abs(best - m)) best = k; }); return { len: best, rate: +R[best] }; };
  const specialFor = (c) => draft.prices.specials.find(x => { try { return new RegExp(x.match, 'i').test(c.name); } catch (e) { return false; } });
  const weeklyOf = (c) => { const o = draft.prices.byKey[c.key]; if (o != null && o !== '') return +o; const sp = specialFor(c); return sp ? +sp.rate : lenRate(c.mins).rate; };
  let priceQ = '';
  const num = (v) => { const n = parseFloat(String(v).replace(/[^0-9.]/g, '')); return isNaN(n) ? null : n; };
  function vPrices() {
    const P = draft.prices, cs = curSess();
    const sess = P.sessions.map((x, i) => '<div class="navrow" style="flex-wrap: wrap;"><label class="check" style="min-width: 150px;"><input type="radio" name="cur" data-cur="' + i + '"' + (i === P.current ? ' checked' : '') + '> <b style="font-size: 14px;">Show on the site</b></label>'
      + '<input type="text" data-sn="' + i + '" value="' + esc(x.name) + '" maxlength="24" aria-label="Session name" style="flex: 1; min-width: 120px; padding: 10px; border: 1px solid #C9CDCB;">'
      + '<input type="text" data-sd="' + i + '" value="' + esc(x.dates) + '" maxlength="30" placeholder="Dates, e.g. Jan 12 – Mar 14" aria-label="' + esc(x.name) + ' dates" style="flex: 1.3; min-width: 150px; padding: 10px; border: 1px solid #C9CDCB;">'
      + '<span style="display: inline-flex; align-items: center; gap: 6px;"><input type="text" inputmode="numeric" data-sw="' + i + '" value="' + esc(x.weeks) + '" aria-label="' + esc(x.name) + ' weeks" style="width: 56px; padding: 10px; border: 1px solid #C9CDCB;"> weeks</span>'
      + (P.sessions.length > 1 ? '<button type="button" class="mini" data-sx="' + i + '" aria-label="Remove ' + esc(x.name) + '">×</button>' : '') + '</div>').join('');
    const rates = '<div class="tiers">' + Object.keys(P.rates).map(Number).sort((a, b) => a - b).map(k => '<div class="tier"><b>' + k + '-minute classes</b><div class="money"><span>$</span><input inputmode="decimal" data-rate="' + k + '" value="' + esc(P.rates[k]) + '" aria-label="Weekly rate for ' + k + '-minute classes"><span style="padding-right: 10px;">/wk</span></div><div class="hint">' + esc(cs.name) + ': <b>' + (cs.weeks ? '$' + forWeeks(P.rates[k], cs.weeks) : '—') + '</b></div></div>').join('') + '</div>';
    const specials = P.specials.map((x, i) => '<div class="navrow"><b>' + esc(x.label) + '</b><div class="money" style="max-width: 150px;"><span>$</span><input inputmode="decimal" data-sp="' + i + '" value="' + esc(x.rate) + '" aria-label="Weekly rate for ' + esc(x.label) + '"><span style="padding-right: 10px;">/wk</span></div><span class="hint" style="margin: 0; min-width: 110px;">' + (+x.rate ? esc(cs.name) + ': $' + forWeeks(x.rate, cs.weeks) : 'Included') + '</span></div>').join('');
    const rows = regular().filter(c => !priceQ || (c.name + ' ' + c.day + ' ' + (TEACH[c.key] || '')).toLowerCase().includes(priceQ.toLowerCase())).map(c => {
      const has = P.byKey[c.key] != null && P.byKey[c.key] !== ''; const sp = specialFor(c); const w = weeklyOf(c);
      const src = has ? '<span class="src ovr">Own price</span>' : sp ? '<span class="src ovr">' + esc(sp.label) + '</span>' : '<span class="src">' + (c.mins || '?') + ' min rate</span>';
      return '<tr><td class="cls"><b>' + esc(c.name) + '</b><span>' + esc(c.day + ' ' + c.time + (TEACH[c.key] ? ' · ' + TEACH[c.key] : '')) + '</span></td><td class="hideM">' + src + '</td><td><div class="money"><span>$</span><input inputmode="decimal" data-price="' + esc(c.key) + '" value="' + esc(w) + '" aria-label="Weekly rate for ' + esc(c.name + ' ' + c.day) + '"><span style="padding-right: 8px;">/wk</span></div>'
        + (has ? '<button type="button" class="btn ghost" data-reset="' + esc(c.key) + '" style="min-height: 30px; font-size: 10px;">Undo</button>' : '') + '</td><td><b>' + (w === 0 ? 'Included' : cs.weeks ? '$' + forWeeks(w, cs.weeks) : '—') + '</b></td></tr>';
    }).join('');
    return '<h1>Sessions &amp; prices</h1><p class="lede">Set up the season once: each session’s dates and number of class weeks, and your weekly rates. The site works out every class price (weekly rate × weeks).</p>'
      + '<div class="panel"><h2>Sessions this season</h2><p class="lede" style="margin-bottom: 14px;">Count only the weeks with classes (skip holiday weeks). Choose the one families are signing up for; its prices show on the site.</p><div class="list">' + sess + '</div><button type="button" class="btn" id="sAddS" style="margin-top: 12px;">+ Add a session</button></div>'
      + '<div class="panel" style="margin-top: 18px;"><h2>Weekly rates by class length</h2><p class="lede" style="margin-bottom: 14px;">From Studio Pro (Session 2 fees ÷ 9 weeks).</p>' + rates + '</div>'
      + '<div class="panel" style="margin-top: 18px;"><h2>Special weekly rates</h2><p class="lede" style="margin-bottom: 14px;">Classes that don’t follow the length rate. Put 0 for a class that’s included with another.</p><div class="list">' + specials + '</div></div>'
      + '<h2 style="margin-top: 30px;">Every class</h2><p class="lede" style="margin-bottom: 12px;">Type a different weekly rate to give one class its own price.</p>'
      + '<input class="search" id="pQ" type="search" placeholder="Find a class, day or teacher" value="' + esc(priceQ) + '"><div style="overflow-x: auto;"><table class="ptable"><thead><tr><th>Class</th><th class="hideM">Rate comes from</th><th>Weekly rate</th><th>' + esc(cs.name) + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  // Menu & header
  function navPreview() {
    const hd = draft.nav.filter(n => n.header);
    return '<div class="lbl">Header on a computer</div><div class="pv-nav"><span class="logo"></span>' + hd.map(n => '<span>' + esc(NAMES[n.id]) + '</span>').join('') + '<span>Parent Portal ↗</span><span class="tr">Free trial →</span></div>'
      + '<div class="lbl" style="margin-top: 18px;">Menu (☰)</div><div class="pv-menu">' + (draft.recital ? '<div style="color: #00ADB5;">Recital →</div>' : '') + draft.nav.map(n => '<div>' + esc(NAMES[n.id]) + '</div>').join('') + '</div>'
      + '<p class="pv-note">Parent Portal and Free trial always stay in the header. On phones the header shows just the logo, Free trial and the menu.</p>';
  }
  function vNav() {
    const hd = draft.nav.filter(n => n.header).length;
    const rows = draft.nav.map((n, i) => '<div class="navrow"><b>' + esc(NAMES[n.id]) + '</b><label class="check"><input type="checkbox" data-hdr="' + i + '"' + (n.header ? ' checked' : '') + (!n.header && hd >= 5 ? ' disabled' : '') + '> In the header</label>'
      + '<button type="button" class="mini" data-nup="' + i + '" aria-label="Move ' + esc(NAMES[n.id]) + ' up"' + (i === 0 ? ' disabled' : '') + '>↑</button><button type="button" class="mini" data-ndown="' + i + '" aria-label="Move ' + esc(NAMES[n.id]) + ' down"' + (i === draft.nav.length - 1 ? ' disabled' : '') + '>↓</button></div>').join('');
    return '<h1>Menu &amp; header</h1><p class="lede">Every page is in the menu. Tick the ones that should also show across the top (up to 5). Use the arrows to change the order of both.</p>'
      + '<div class="two"><div class="list">' + rows + '<p class="hint">' + hd + ' of 5 header spots used.</p></div><div class="previewbox">' + navPreview() + '</div></div>';
  }

  // Photos & videos
  function slot(key, title, where, src, go) {
    return '<div class="slot"><span class="thumb">' + (src ? '<img src="' + esc(src) + '" alt="">' : 'Photo') + '</span><div class="info"><b>' + esc(title) + '</b><span>' + esc(where) + '</span></div>'
      + (go ? '<button type="button" class="btn" data-go="' + go + '">Edit there</button>' : '<label class="btn" for="ph-' + key + '">' + (src ? 'Change' : 'Add photo') + '</label><input type="file" accept="image/*" class="sr" id="ph-' + key + '" data-slot="' + key + '">' + (src ? '<button type="button" class="btn ghost" data-slotx="' + key + '">Remove</button>' : '')) + '</div>';
  }
  function vPhotos() {
    const P = draft.photos, hp = draft.home.programs;
    return '<h1>Photos &amp; videos</h1><p class="lede">Every photo spot on the site, in one place. Photos are resized for you.</p>'
      + '<h2>Videos</h2><div class="note"><b>Homepage video:</b> your recital montage is playing now. Videos are too big for this preview admin, so send a new one to Leigha for now. In the finished admin you’ll upload it here.</div>'
      + '<div class="slot"><span class="thumb"><img src="hero_poster.jpg" alt=""></span><div class="info"><b>Homepage video</b><span>Loops at the top of the homepage, sound off.</span></div><button type="button" class="btn" disabled>Upload video</button></div>'
      + '<h2 style="margin-top: 26px;">Photos</h2><div class="list">'
      + slot('studio', 'The studio', 'About page · next to the studio story', P.studio)
      + slot('company', 'Company on stage', 'Company page · next to “The program”', P.company)
      + hp.map((p, i) => slot('prog' + i, 'Homepage card ' + (i + 1) + ': ' + p.title, 'Homepage · program cards', p.photo)).join('')
      + slot('staff', 'Instructor headshots', draft.staff.filter(s => s.photo).length + ' of ' + draft.staff.length + ' added', (draft.staff.find(s => s.photo) || {}).photo, 'staff')
      + '</div>';
  }

  // ---------- render + events ----------
  function render() {
    navs(); status();
    $('main').innerHTML = page === 'banner' ? vBanner() : page === 'recital' ? vRecital() : page === 'staff' ? vStaff() : page === 'homepage' ? vHomepage() : page === 'prices' ? vPrices() : page === 'nav' ? vNav() : page === 'photos' ? vPhotos() : vHome();
    const pv = () => $('pv');
    if (page === 'banner') { bind('bText', 60, v => draft.banner.text = v, () => pv().innerHTML = bannerPreview()); bindPicker('bLink', v => draft.banner.href = v, () => pv().innerHTML = bannerPreview()); }
    if (page === 'homepage') { const h = draft.home, uh = () => $('pvHero').innerHTML = heroPreview();
      bind('hTag', 80, v => h.tagline = v, uh); h.facts.forEach((f, i) => { bind('fL' + i, 14, v => f.label = v, uh); bind('fT' + i, 40, v => f.text = v, uh); });
      if (openItem >= 0) { const p = h.programs[openItem], i = openItem, up = () => pv().innerHTML = progPreview(p, i);
        bind('pT', 24, v => p.title = v, up); bind('pS', 70, v => p.sub = v, up); bind('pC', 20, v => p.cta = v, up); bind('pM', 600, v => p.more = v, up); bindPicker('pL', v => p.link = v, up);
        const f = $('pPhoto'); if (f) f.addEventListener('change', () => { const file = f.files && f.files[0]; if (file) shrink(file, (u) => { p.photo = u; saveDraft(); render(); }, 900, 600); }); } }
    if (page === 'prices') { const P = draft.prices;
      const on = (sel, fn) => document.querySelectorAll(sel).forEach(el => el.addEventListener('change', () => { fn(el); saveDraft(); render(); }));
      on('[data-cur]', el => P.current = +el.dataset.cur);
      on('[data-sn]', el => P.sessions[+el.dataset.sn].name = el.value.trim() || 'Session');
      on('[data-sd]', el => P.sessions[+el.dataset.sd].dates = el.value.trim());
      on('[data-sw]', el => { const n = num(el.value); P.sessions[+el.dataset.sw].weeks = n == null ? '' : Math.round(n); });
      on('[data-rate]', el => { const n = num(el.value); if (n != null) P.rates[el.dataset.rate] = n; });
      on('[data-sp]', el => { const n = num(el.value); if (n != null) P.specials[+el.dataset.sp].rate = n; });
      on('[data-price]', el => { const k = el.dataset.price, c = CLASSES.find(x => x.key === k), n = num(el.value); delete P.byKey[k];
        if (n != null && c && n !== weeklyOf(c)) P.byKey[k] = n; });
      const q = $('pQ'); if (q) q.addEventListener('input', () => { priceQ = q.value; const pos = q.selectionStart; render(); const q2 = $('pQ'); q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (e) {} }); }
    if (page === 'nav') document.querySelectorAll('[data-hdr]').forEach(el => el.addEventListener('change', () => { draft.nav[+el.dataset.hdr].header = el.checked; saveDraft(); render(); }));
    if (page === 'photos') document.querySelectorAll('[data-slot]').forEach(el => el.addEventListener('change', () => { const file = el.files && el.files[0]; if (!file) return; const k = el.dataset.slot;
      shrink(file, (u) => { if (/^prog/.test(k)) draft.home.programs[+k.slice(4)].photo = u; else draft.photos[k] = u; saveDraft(); render(); }, 1200, 900); }));
    if (page === 'recital' && openItem >= 0) { const r = draft.rc[openItem]; const up = () => pv().innerHTML = rcPreview(r);
      bind('rT', 28, v => r.t = v, up); bind('rD', 140, v => r.d = v, up); bind('rM', 600, v => r.more = v, up); bind('rL', 20, v => r.label = v, up); bind('rU', 300, v => r.url = v.trim(), up); }
    if (page === 'staff' && openItem >= 0) { const s = draft.staff[openItem]; const up = () => pv().innerHTML = staffPreview(s);
      bind('sN', 24, v => s.name = v, up); bind('sT', 20, v => s.tag = v, up); bind('sR', 40, v => s.role = v, up); bind('sB', 600, v => s.bio = v, () => { up(); const tg = document.querySelector('.item.open .tag'); if (tg) tg.style.display = s.bio.trim() ? 'none' : ''; });
      const f = $('sPhoto'); if (f) f.addEventListener('change', () => { const file = f.files && f.files[0]; if (!file) return; shrink(file, (url) => { s.photo = url; saveDraft(); render(); }); }); }
  }
  // resize photos in the browser so they stay small
  function shrink(file, done, tw, th) {
    const img = new Image(); const r = new FileReader();
    r.onload = () => { img.onload = () => { const W = tw || 480, H = th || 600, c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
      const s = Math.max(W / img.width, H / img.height), w = img.width * s, h = img.height * s; g.drawImage(img, (W - w) / 2, (H - h) / 2, w, h); done(c.toDataURL('image/jpeg', 0.82)); };
      img.onerror = () => toast('That file doesn’t look like a photo.'); img.src = r.result; };
    r.readAsDataURL(file);
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, [data-go]'); if (!t) return;
    const d = t.dataset;
    if (d.go) return go(d.go);
    if (t.id === 'publishTop' || t.id === 'publishBar') return publish();
    if (t.id === 'discardTop' || t.id === 'discardBar') return discard();
    if (d.nup !== undefined || d.ndown !== undefined) { const i = +(d.nup !== undefined ? d.nup : d.ndown), j = d.nup !== undefined ? i - 1 : i + 1; const a = draft.nav; [a[i], a[j]] = [a[j], a[i]]; saveDraft(); render(); return; }
    if (d.reset !== undefined) { delete draft.prices.byKey[d.reset]; saveDraft(); render(); return; }
    if (d.sx !== undefined) { const P = draft.prices, i = +d.sx; P.sessions.splice(i, 1); if (P.current >= P.sessions.length) P.current = P.sessions.length - 1; else if (P.current > i) P.current--; saveDraft(); render(); return; }
    if (t.id === 'sAddS') { const P = draft.prices; P.sessions.push({ name: 'Session ' + (P.sessions.length + 1), dates: '', weeks: '' }); saveDraft(); render(); return; }
    if (d.slotx !== undefined) { const k = d.slotx; if (/^prog/.test(k)) draft.home.programs[+k.slice(4)].photo = ''; else delete draft.photos[k]; saveDraft(); render(); return; }
    if (t.id === 'pPhotoX') { draft.home.programs[openItem].photo = ''; saveDraft(); render(); return; }
    if (t.id === 'recSw') { draft.recital = !draft.recital; saveDraft(); render(); return; }
    if (d.open !== undefined) { const i = +d.open; openItem = openItem === i ? -1 : i; confirmDel = -1; render(); return; }
    if (d.close) { openItem = -1; confirmDel = -1; render(); return; }
    if (d.up !== undefined || d.down !== undefined) { const i = +(d.up !== undefined ? d.up : d.down), j = d.up !== undefined ? i - 1 : i + 1; const a = draft.staff; [a[i], a[j]] = [a[j], a[i]]; if (openItem === i) openItem = j; else if (openItem === j) openItem = i; saveDraft(); render(); return; }
    if (t.id === 'sPhotoX') { draft.staff[openItem].photo = ''; saveDraft(); render(); return; }
    if (d.del !== undefined) { confirmDel = +d.del; render(); return; }
    if (d.delno) { confirmDel = -1; render(); return; }
    if (d.delyes !== undefined) { const nm = draft.staff[+d.delyes].name; draft.staff.splice(+d.delyes, 1); openItem = -1; confirmDel = -1; saveDraft(); render(); toast(nm + ' removed. Press Publish to update the site.'); return; }
    if (t.id === 'sAdd') { draft.staff.push({ name: '', role: '', tag: '', bio: '', photo: '' }); openItem = draft.staff.length - 1; saveDraft(); render(); const n = $('sN'); if (n) n.focus(); return; }
  });

  render();
})();
</script>
</body>
</html>
